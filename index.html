<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Algebra Final Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#132029;
    --bg-panel:#182a34;
    --bg-panel-2:#1e333f;
    --chalk-line: rgba(238,240,230,0.09);
    --chalk: #eef0e6;
    --chalk-dim: #9fb0ac;
    --accent: #f2c14e;
    --accent-dim: #c9a23f;
    --ok: #7fc9a3;
    --ok-bg: rgba(127,201,163,0.14);
    --bad: #e08a72;
    --bad-bg: rgba(224,138,114,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #1c313c 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, #16262f 0%, transparent 55%),
      var(--bg);
    color:var(--chalk);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Fraunces', serif;}

  .board-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      repeating-linear-gradient(0deg, var(--chalk-line) 0px, var(--chalk-line) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, var(--chalk-line) 0px, var(--chalk-line) 1px, transparent 1px, transparent 64px);
    opacity:0.5;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, black 30%, transparent 90%);
  }

  .wrap{position:relative; z-index:1; max-width:880px; margin:0 auto; padding:28px 20px 90px;}

  header.hero{ text-align:center; padding:18px 0 30px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.14em;
    color:var(--accent); text-transform:uppercase; background:rgba(242,193,78,0.08);
    border:1px solid rgba(242,193,78,0.25); padding:6px 14px; border-radius:100px;
  }
  h1.display{
    font-size:clamp(28px, 5vw, 44px); font-weight:700; margin:16px 0 8px; line-height:1.25;
  }
  h1.display .p{color:var(--accent);}
  .subtitle{color:var(--chalk-dim); font-size:15px; max-width:520px; margin:0 auto; line-height:1.9;}

  nav.tabs{
    display:flex; gap:8px; justify-content:center; margin:26px 0 10px; flex-wrap:wrap;
  }
  .tab-btn{
    font-family:'Tajawal'; font-weight:700; font-size:14.5px; cursor:pointer;
    background:var(--bg-panel); color:var(--chalk-dim); border:1px solid var(--chalk-line);
    padding:10px 20px; border-radius:100px; transition:.18s ease;
  }
  .tab-btn:hover{ color:var(--chalk); border-color:rgba(242,193,78,0.4); }
  .tab-btn.active{ background:var(--accent); color:#1a1508; border-color:var(--accent); }

  section.panel{ display:none; animation:fade .35s ease; }
  section.panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .statusbar{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    background:var(--bg-panel); border:1px solid var(--chalk-line); border-radius:100px;
    padding:10px 20px; margin:18px 0 22px; font-size:14px; color:var(--chalk-dim);
  }
  .statusbar b{ color:var(--accent); font-family:'JetBrains Mono'; }
  .progress-track{ flex:1; height:6px; background:rgba(238,240,230,0.1); border-radius:100px; overflow:hidden; margin:0 14px; }
  .progress-fill{ height:100%; background:var(--accent); width:0%; transition:width .3s ease; }
  .iconbtn{
    background:none; border:1px solid var(--chalk-line); color:var(--chalk-dim);
    border-radius:100px; padding:7px 14px; font-family:'Tajawal'; font-size:13px; font-weight:700;
    cursor:pointer; transition:.15s;
  }
  .iconbtn:hover{ color:var(--accent); border-color:var(--accent-dim); }

  .card{
    background:var(--bg-panel); border:1px solid var(--chalk-line); border-radius:var(--radius);
    padding:28px 26px; margin-bottom:16px;
  }
  .q-index{ font-family:'JetBrains Mono'; color:var(--accent-dim); font-size:13px; margin-bottom:10px; }
  .q-text{ font-size:19px; line-height:1.7; margin-bottom:20px; font-weight:500; }

  .options{ display:grid; gap:10px; }
  .opt{
    display:flex; align-items:center; gap:12px; text-align:right;
    background:var(--bg-panel-2); border:1px solid var(--chalk-line); border-radius:10px;
    padding:14px 16px; cursor:pointer; font-size:15.5px; transition:.15s ease; color:var(--chalk);
  }
  .opt:hover{ border-color:rgba(242,193,78,0.45); }
  .opt .tag{
    font-family:'JetBrains Mono'; font-size:12px; width:22px; height:22px; border-radius:6px;
    border:1px solid var(--chalk-line); display:flex; align-items:center; justify-content:center;
    color:var(--chalk-dim); flex-shrink:0;
  }
  .opt.correct{ background:var(--ok-bg); border-color:var(--ok); }
  .opt.correct .tag{ background:var(--ok); color:#0d1f16; border-color:var(--ok); }
  .opt.wrong{ background:var(--bad-bg); border-color:var(--bad); }
  .opt.wrong .tag{ background:var(--bad); color:#2a1108; border-color:var(--bad); }
  .opt.disabled{ pointer-events:none; opacity:.85; }

  .feedback{ margin-top:16px; font-size:14px; padding:12px 16px; border-radius:10px; display:none; }
  .feedback.show{ display:block; animation:fade .25s ease; }
  .feedback.ok{ background:var(--ok-bg); color:var(--ok); }
  .feedback.bad{ background:var(--bad-bg); color:var(--bad); }

  .nextbar{ display:flex; justify-content:flex-end; margin-top:18px; gap:10px; }
  .nextbtn{
    background:var(--accent); color:#1a1508; border:none; font-family:'Tajawal'; font-weight:700;
    font-size:14.5px; padding:11px 24px; border-radius:100px; cursor:pointer; transition:.15s;
  }
  .nextbtn:disabled{ opacity:.35; cursor:not-allowed; }
  .nextbtn:not(:disabled):hover{ background:#ffd873; }
  .ghostbtn{
    background:none; color:var(--chalk-dim); border:1px solid var(--chalk-line); font-family:'Tajawal';
    font-weight:700; font-size:14.5px; padding:11px 22px; border-radius:100px; cursor:pointer; transition:.15s;
  }
  .ghostbtn:hover{ color:var(--chalk); border-color:rgba(238,240,230,0.35); }

  .end-card{ text-align:center; padding:50px 20px; }
  .end-card .big{ font-family:'Fraunces'; font-size:42px; color:var(--accent); }
  .restart-btn{
    margin-top:18px; background:var(--accent); color:#1a1508; border:none; font-weight:700;
    padding:12px 28px; border-radius:100px; cursor:pointer; font-family:'Tajawal'; font-size:15px;
  }

  /* ---- Essay: step-by-step ---- */
  .essay-item{
    background:var(--bg-panel); border:1px solid var(--chalk-line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden;
  }
  .essay-head{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:20px 22px; cursor:pointer; font-size:16px; font-weight:700;
  }
  .essay-head .tagnum{
    font-family:'JetBrains Mono'; color:var(--accent-dim); font-size:12.5px; display:block; margin-bottom:6px; font-weight:500;
  }
  .essay-head .chevron{ transition:.2s ease; color:var(--chalk-dim); flex-shrink:0; }
  .essay-item.open .chevron{ transform:rotate(180deg); }
  .essay-body{ display:none; padding:0 22px 22px; }
  .essay-item.open .essay-body{ display:block; }

  .steps-status{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-family:'JetBrains Mono'; font-size:12.5px; color:var(--chalk-dim); margin-bottom:14px;
  }
  .steps-track{ flex:1; height:5px; background:rgba(238,240,230,0.1); border-radius:100px; overflow:hidden; }
  .steps-fill{ height:100%; background:var(--accent); width:0%; transition:width .25s ease; }

  .step-row{
    background:var(--bg-panel-2); border:1px solid var(--chalk-line); border-radius:10px;
    padding:15px 18px; margin-bottom:10px; font-size:15px; line-height:1.85; color:var(--chalk);
    animation:fade .3s ease;
  }
  .step-row .step-label{ color:var(--accent); font-family:'JetBrains Mono'; font-size:12px; display:block; margin-bottom:6px; font-weight:700; }
  .step-row.final{ border-color:var(--ok); background:var(--ok-bg); }
  .step-row.final .step-label{ color:var(--ok); }

  /* ---- Matrix rendering (used in both MCQ and essay) ---- */
  .mtx-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin:14px 0 4px; flex-wrap:wrap; direction:ltr; }
  .eq-sign{ font-family:'JetBrains Mono'; font-size:20px; color:var(--accent); font-weight:700; }
  .matrix{
    display:inline-block; vertical-align:middle;
    border-left:2px solid var(--chalk); border-right:2px solid var(--chalk);
    padding:2px 12px; border-radius:2px; direction:ltr;
  }
  .matrix table{ border-collapse:collapse; }
  .matrix td{
    border:none; padding:4px 12px; font-family:'JetBrains Mono', monospace; font-size:14.5px;
    text-align:center; color:var(--chalk); white-space:nowrap;
  }
  .matrix td.aug{ border-left:1px solid rgba(238,240,230,0.3); }

  .locked-hint{
    text-align:center; color:var(--chalk-dim); font-size:13.5px; padding:10px 0 4px; font-style:italic;
  }

  footer{ text-align:center; color:var(--chalk-dim); font-size:12.5px; margin-top:40px; opacity:.6; }

  @media (max-width:520px){
    .card{ padding:20px 18px; }
    .q-text{ font-size:17px; }
  }
</style>
</head>
<body>
<div class="board-texture"></div>
<div class="wrap">

  <header class="hero">
    <span class="eyebrow">Linear Algebra · Final Exam</span>
    <h1 class="display">.Quick Revision <span class="p">Linear Algebra</span><br>ومتنساش تدعيلي. 🤲😊</h1>
    <p class="subtitle">15 اختياري، و4 سوال مقالي "بالخطوات".</p>
  </header>

  <nav class="tabs">
    <div class="tab-btn active" data-tab="mcq">اختياري.</div>
    <div class="tab-btn" data-tab="essay">أسئلة المقالي.</div>
  </nav>

  <!-- MCQ PANEL -->
  <section class="panel active" id="panel-mcq">
    <div class="statusbar">
      <span>السؤال <b id="mcq-pos">1</b> / <span id="mcq-total">15</span></span>
      <div class="progress-track"><div class="progress-fill" id="mcq-progress"></div></div>
      <span>الصح: <b id="mcq-score">0</b></span>
      <button class="iconbtn" id="mcq-shuffle">🔀 كوكتيل</button>
    </div>
    <div id="mcq-stage"></div>
  </section>

  <!-- ESSAY PANEL -->
  <section class="panel" id="panel-essay">
    <div class="statusbar" style="justify-content:center;">
      <span>دوس على السؤال عشان يظهرلك الحل بالخطوات، واحفظها.</span>
    </div>
    <div id="essay-stage"></div>
  </section>

  <footer>راجع براحتك ✍️</footer>
</div>

<script>
/* ---------------- DATA ---------------- */
const mtx = (rows, augCol=-1) => `<div class="matrix"><table>${rows.map(r=>
  `<tr>${r.map((c,ci)=>`<td class="${ci===augCol?'aug':''}">${c}</td>`).join('')}</tr>`
).join('')}</table></div>`;

const mcq = [
{q:`Which values of x and y make the following matrices equal?
  <div class="mtx-row">
    ${mtx([['3x+7','5'],['y+1','2−3x']])}
    <span class="eq-sign">=</span>
    ${mtx([['0','y−2'],['8','4']])}
  </div>`, opts:["x = −1/2, y = 7","Not possible to find","x = −2/3, y = 7","x = −1/3, y = −2/3"], a:1},
{q:"The number of all possible 3×3 matrices with each entry 0 or 1 is:", opts:["27","18","81","512"], a:3},
{q:`The matrix I₃ shown below is:
  <div class="mtx-row">${mtx([['1','0','0'],['0','1','0'],['0','0','1']])}</div>`, opts:["Square matrix","Diagonal matrix","Unit (identity) matrix","All the above"], a:3},
{q:`The following matrix is a:
  <div class="mtx-row">${mtx([['0','15','−7'],['−15','0','5'],['7','−5','0']])}</div>`, opts:["Diagonal matrix","Skew-symmetric matrix","Symmetric matrix","None of the above"], a:1},
{q:"If a matrix has 6 elements, the number of possible orders (m×n) can be:", opts:["2","4","3","6"], a:1},
{q:`If A is the matrix below and A = Aᵀ, then:
  <div class="mtx-row">${mtx([['7','y'],['x','2']])}</div>`, opts:["x = 0, y = 5","x = y","x + y = 5","x − y = 5"], a:1},
{q:"If a matrix A is both symmetric and skew-symmetric, then A is:", opts:["A scalar matrix","A diagonal matrix","A zero matrix of order n×n","A rectangular matrix"], a:2},
{q:"Which of the following sets spans ℝ²?", opts:["{(1,2)}","{(1,0), (2,0)}","{(1,0), (0,1)}","{(0,0)}"], a:2},
{q:"The trace of a zero matrix is:", opts:["1","n","0","Undefined"], a:2},
{q:"If two vectors are scalar multiples of each other, they are:", opts:["Orthogonal","Linearly independent","Linearly dependent","Basis vectors"], a:2},
{q:"The span of a set of vectors is:", opts:["The number of vectors","The set of all linear combinations of those vectors","The determinant","The rank"], a:1},
{q:"The rank of a matrix is:", opts:["Number of columns","Number of rows","Maximum number of linearly independent rows or columns","Determinant value"], a:2},
{q:"If det(A) = 0, then the matrix A is:", opts:["Invertible","Orthogonal","Singular","Diagonal"], a:2},
{q:"The determinant of a triangular matrix is:", opts:["Sum of diagonal elements","Product of diagonal elements","Zero","One"], a:1},
{q:"If one column of a matrix is a linear combination of others, then the rank is:", opts:["Full","Reduced","Zero","One"], a:1},
];

/* Each essay item: head + ordered steps revealed one at a time. Last step is the final answer. */
const essay = [
{
  head:"1) Solve the system using Row Echelon Form",
  sub:"4x + 8y − 4z = 4,  3x + 8y + 5z = −11,  −2x + y + 12z = −17",
  steps:[
    `Write the augmented matrix:
     <div class="mtx-row">${mtx([['4','8','−4','4'],['3','8','5','−11'],['−2','1','12','−17']],3)}</div>`,
    `Make the first pivot equal 1: R1 ← R1 ÷ 4
     <div class="mtx-row">${mtx([['1','2','−1','1'],['3','8','5','−11'],['−2','1','12','−17']],3)}</div>`,
    `Eliminate below the first pivot: R2 ← R2 − 3R1,  R3 ← R3 + 2R1
     <div class="mtx-row">${mtx([['1','2','−1','1'],['0','2','8','−14'],['0','5','10','−15']],3)}</div>`,
    `Make the second pivot equal 1: R2 ← R2 ÷ 2
     <div class="mtx-row">${mtx([['1','2','−1','1'],['0','1','4','−7'],['0','5','10','−15']],3)}</div>`,
    `Eliminate below the second pivot: R3 ← R3 − 5R2
     <div class="mtx-row">${mtx([['1','2','−1','1'],['0','1','4','−7'],['0','0','−10','20']],3)}</div>`,
    `Make the third pivot equal 1: R3 ← R3 ÷ (−10)
     <div class="mtx-row">${mtx([['1','2','−1','1'],['0','1','4','−7'],['0','0','1','−2']],3)}</div>`,
    `<b>Back substitution:</b><br>
     From row 3: z = −2.<br>
     From row 2: y + 4z = −7  ⟹  y = −7 − 4(−2) = 1.<br>
     From row 1: x + 2y − z = 1  ⟹  x = 1 − 2(1) + (−2) = −3.`,
    `<b>Final answer:</b>  x = −3,  y = 1,  z = −2`,
  ]
},
{
  head:"2) Check whether the system is Consistent",
  sub:"x − 3y + 2z = 12,  2x − 5y + 5z = 14,  x − 2y + 3z = 20",
  steps:[
    `Write the augmented matrix:
     <div class="mtx-row">${mtx([['1','−3','2','12'],['2','−5','5','14'],['1','−2','3','20']],3)}</div>`,
    `Eliminate below the first pivot: R2 ← R2 − 2R1,  R3 ← R3 − R1
     <div class="mtx-row">${mtx([['1','−3','2','12'],['0','1','1','−10'],['0','1','1','8']],3)}</div>`,
    `Eliminate below the second pivot: R3 ← R3 − R2
     <div class="mtx-row">${mtx([['1','−3','2','12'],['0','1','1','−10'],['0','0','0','18']],3)}</div>`,
    `Interpret the last row: 0x + 0y + 0z = 18  ⟹  0 = 18, which is a contradiction.`,
    `<b>Final answer:</b> the system is <u>Inconsistent</u> — it has no solution, since the last row leads to a contradiction.`,
  ]
},
{
  head:"3) Find the Eigenvalues and Eigenvectors",
  sub:"A = [1 2; 2 1]",
  steps:[
    `Set up the characteristic equation: |A − λI| = 0, where
     <div class="mtx-row">A − λI = ${mtx([['1−λ','2'],['2','1−λ']])}</div>`,
    `Expand the determinant: (1−λ)² − 4 = 0  ⟹  λ² − 2λ − 3 = 0`,
    `Factor the equation: (λ − 3)(λ + 1) = 0  ⟹  λ₁ = 3,  λ₂ = −1`,
    `<b>Eigenvector for λ₁ = 3:</b>
     <div class="mtx-row">A − 3I = ${mtx([['−2','2'],['2','−2']])}</div>
     Solve (A−3I)X = 0  ⟹  −2x₁ + 2x₂ = 0  ⟹  x₂ = x₁  ⟹  eigenvector = [1, 1]ᵀ (x₁ arbitrary)`,
    `<b>Eigenvector for λ₂ = −1:</b>
     <div class="mtx-row">A + I = ${mtx([['2','2'],['2','2']])}</div>
     Solve (A+I)X = 0  ⟹  2x₁ + 2x₂ = 0  ⟹  x₂ = −x₁  ⟹  eigenvector = [1, −1]ᵀ (x₁ arbitrary)`,
    `<b>Final answer:</b>  λ₁ = 3 with eigenvector [1, 1]ᵀ,  and  λ₂ = −1 with eigenvector [1, −1]ᵀ`,
  ]
},
{
  head:"4) Set up the system of equations representing the network",
  sub:"Using flow conservation: Flow In = Flow Out at every junction",
  steps:[
    `<b>Junction 1:</b>  x₁ + x₂ = 20`,
    `<b>Junction 2:</b>  x₃ − x₄ = −20`,
    `<b>Junction 3:</b>  x₂ + x₃ = 20`,
    `<b>Junction 4:</b>  x₁ − x₅ = −10`,
    `<b>Junction 5:</b>  −x₄ + x₅ = −10`,
    `<b>Final full system:</b><br>
     x₁ + x₂ = 20<br>
     x₃ − x₄ = −20<br>
     x₂ + x₃ = 20<br>
     x₁ − x₅ = −10<br>
     −x₄ + x₅ = −10`,
  ]
},
];

/* ---------------- HELPERS ---------------- */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------------- TABS ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------------- MCQ ENGINE ---------------- */
let mcqOrder = mcq.map((_,i)=>i);
let mcqIdx = 0, mcqScore = 0, mcqAnswered = false;

function renderMCQ(){
  document.getElementById('mcq-pos').textContent = Math.min(mcqIdx+1, mcq.length);
  document.getElementById('mcq-total').textContent = mcq.length;
  document.getElementById('mcq-score').textContent = mcqScore;
  document.getElementById('mcq-progress').style.width = ((mcqIdx)/mcq.length*100)+'%';
  mcqAnswered = false;

  if(mcqIdx >= mcq.length){
    document.getElementById('mcq-stage').innerHTML = `
      <div class="card end-card">
        <div class="big">${mcqScore} / ${mcq.length}</div>
        <p style="color:var(--chalk-dim)">خلصت كل أسئلة الاختياري!</p>
        <button class="restart-btn" onclick="restartMCQ()">ابدأ من جديد</button>
      </div>`;
    document.getElementById('mcq-progress').style.width='100%';
    return;
  }

  const item = mcq[mcqOrder[mcqIdx]];
  const letters = ['A','B','C','D'];
  document.getElementById('mcq-stage').innerHTML = `
    <div class="card">
      <div class="q-index mono">MCQ · Question ${mcqIdx+1}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.opts.map((o,i)=>`<div class="opt" data-i="${i}"><span class="tag">${letters[i]}</span><span>${o}</span></div>`).join('')}
      </div>
      <div class="feedback" id="mcq-feedback"></div>
      <div class="nextbar"><button class="nextbtn" id="mcq-next" disabled>التالي</button></div>
    </div>`;

  document.querySelectorAll('#mcq-stage .opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(mcqAnswered) return;
      mcqAnswered = true;
      const chosen = parseInt(el.dataset.i);
      const correct = item.a;
      document.querySelectorAll('#mcq-stage .opt').forEach(o=>o.classList.add('disabled'));
      el.classList.add(chosen===correct?'correct':'wrong');
      if(chosen!==correct){
        document.querySelector(`#mcq-stage .opt[data-i="${correct}"]`).classList.add('correct');
      } else {
        mcqScore++;
        document.getElementById('mcq-score').textContent = mcqScore;
      }
      const fb = document.getElementById('mcq-feedback');
      fb.classList.add('show', chosen===correct?'ok':'bad');
      fb.textContent = chosen===correct ? '✔ إجابة صحيحة!' : `✘ إجابة غلط — الصح هو "${item.opts[correct]}"`;
      document.getElementById('mcq-next').disabled = false;
    });
  });

  document.getElementById('mcq-next').addEventListener('click', ()=>{
    mcqIdx++;
    renderMCQ();
  });
}
function restartMCQ(){ mcqIdx=0; mcqScore=0; renderMCQ(); }
document.getElementById('mcq-shuffle').addEventListener('click', ()=>{
  mcqOrder = shuffleArr(mcqOrder);
  mcqIdx=0; mcqScore=0;
  renderMCQ();
});
renderMCQ();

/* ---------------- ESSAY: STEP-BY-STEP ENGINE ---------------- */
const essayState = essay.map(()=>({ open:false, revealed:0 }));

function renderEssay(){
  const stage = document.getElementById('essay-stage');
  stage.innerHTML = essay.map((e,i)=>`
    <div class="essay-item" id="essay-${i}">
      <div class="essay-head" onclick="toggleEssay(${i})">
        <span><span class="tagnum mono">Essay ${i+1} · ${e.sub}</span>${e.head}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="essay-body" id="essay-body-${i}"></div>
    </div>`).join('');
  essay.forEach((e,i)=> renderEssayBody(i));
}

function renderEssayBody(i){
  const e = essay[i];
  const st = essayState[i];
  const body = document.getElementById('essay-body-'+i);
  const revealedSteps = e.steps.slice(0, st.revealed);
  const done = st.revealed >= e.steps.length;

  body.innerHTML = `
    <div class="steps-status">
      <span>Step <b class="mono" style="color:var(--accent)">${st.revealed}</b> / ${e.steps.length}</span>
      <div class="steps-track"><div class="steps-fill" style="width:${(st.revealed/e.steps.length*100)}%"></div></div>
    </div>
    ${revealedSteps.map((s,idx)=>`
      <div class="step-row ${idx===revealedSteps.length-1 && done ? 'final':''}">
        <span class="step-label">${idx===revealedSteps.length-1 && done ? 'Final Answer' : 'Step '+(idx+1)}</span>
        ${s}
      </div>`).join('')}
    ${st.revealed===0 ? `<div class="locked-hint">قبل ما تشوف الخطوات، جرّب تفتكرها. 🧠</div>` : ''}
    <div class="nextbar">
      <button class="ghostbtn" onclick="resetEssay(${i}, event)">↺ Start over</button>
      <button class="nextbtn" ${done?'disabled':''} onclick="revealNext(${i}, event)">${done ? 'All steps done ✔' : 'Show next step'}</button>
    </div>`;
}

function toggleEssay(i){
  const el = document.getElementById('essay-'+i);
  essayState[i].open = !essayState[i].open;
  el.classList.toggle('open', essayState[i].open);
}
function revealNext(i, ev){
  ev.stopPropagation();
  if(essayState[i].revealed < essay[i].steps.length) essayState[i].revealed++;
  renderEssayBody(i);
}
function resetEssay(i, ev){
  ev.stopPropagation();
  essayState[i].revealed = 0;
  renderEssayBody(i);
}
renderEssay();
</script>
